# 默认无任何服务（避免误启）；按需加 profile。
#
#   仅基础设施（PostgreSQL + Mailhog）：
#     docker compose --profile full up -d
#
#   后端 + 前端（Nginx 反代 /api → api:5000，浏览器访问 http://localhost:8080）：
#     docker compose --profile app up --build
#
#   全套：
#     docker compose --profile full --profile app up --build

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["full"]
    environment:
      POSTGRES_USER: m4
      POSTGRES_PASSWORD: m4
      POSTGRES_DB: m4_notify
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m4 -d m4_notify"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    profiles: ["full"]
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build: ./backend
    profiles: ["app"]
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: docker-dev-change-me
      M4_DATABASE_PATH: /data/notify.db
    volumes:
      - ira_notify_sqlite:/data

  web:
    build: ./frontend
    profiles: ["app"]
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  ira_notify_sqlite:
